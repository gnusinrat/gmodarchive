<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garry's Mod Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background-image: radial-gradient(circle at 20% 30%, #2a2a4a 0%, #0f0f1a 100%);
        }

        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #ff8c42;
            text-shadow: 0 0 20px rgba(255, 140, 66, 0.3);
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 3rem;
            letter-spacing: 0.5px;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
        }

        .card {
            background: linear-gradient(145deg, #23233a, #1c1c30);
            border-radius: 20px;
            padding: 2rem 1.8rem;
            width: 320px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 140, 66, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 140, 66, 0.08) 0%, transparent 70%);
            transform: rotate(0deg);
            transition: transform 0.6s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(255, 140, 66, 0.3);
        }

        .card:hover::before {
            transform: rotate(180deg);
        }

        .version-badge {
            background: #ff8c42;
            color: #1a1a2e;
            font-weight: 700;
            font-size: 1.4rem;
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            margin-bottom: 1.2rem;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        .card-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
            position: relative;
            z-index: 1;
            color: #f0f0f0;
        }

        .description {
            font-size: 0.95rem;
            color: #bbbbbb;
            margin-bottom: 2rem;
            line-height: 1.5;
            flex-grow: 1;
            position: relative;
            z-index: 1;
        }

        .file-name {
            font-size: 0.85rem;
            background: #2e2e4a;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            color: #ffaa6b;
            margin-bottom: 1.5rem;
            font-family: monospace;
            position: relative;
            z-index: 1;
        }

        .download-btn {
            background: #ff8c42;
            color: #1a1a2e;
            font-weight: 700;
            font-size: 1rem;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 8px 20px rgba(255, 140, 66, 0.4);
            position: relative;
            z-index: 1;
        }

        .download-btn:hover {
            background: #ffa166;
            box-shadow: 0 12px 25px rgba(255, 140, 66, 0.6);
            transform: scale(1.03);
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        .download-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        footer {
            margin-top: 3rem;
            font-size: 0.9rem;
            color: #666;
        }

        footer a {
            color: #ff8c42;
            text-decoration: none;
        }

        @media (max-width: 700px) {
            h1 {
                font-size: 2.2rem;
            }
            .card {
                width: 100%;
                max-width: 360px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 GMod Archive</h1>
<a href="https://github.com/gnusinrat/gmodarchive/blob/main/README.md">click here for installation instructions</a>

        <div class="cards">
            <!-- GMod 12 Card -->
            <div class="card">
                <span class="version-badge">v12</span>
                <div class="card-title">Garry's Mod 12</div>
                <p class="description">
                    This version requires having Garry's Mod in your Steam library.
                </p>
                <div class="file-name">nxbox12.zip</div>
                <a href="https://github.com/gnusinrat/gmodarchive/releases/download/GMod12/nxbox12.zip"
                   class="download-btn" download>
                    <svg class="download-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                    </svg>
                    Download
                </a>
            </div>

            <!-- GMod 9 Card -->
            <div class="card">
                <span class="version-badge">v9</span>
                <div class="card-title">Garry's Mod 9</div>
                <p class="description">
                    that one
                </p>
                <div class="file-name">nxbox9.zip</div>
                <a href="https://github.com/gnusinrat/gmodarchive/releases/download/GMod9/nxbox9.zip"
                   class="download-btn" download>
                    <svg class="download-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                    </svg>
                    Download
                </a>
            </div>
        </div>

        <footer>
            <p>Archived with ❤️ — see the <a href="https://github.com/gnusinrat/gmodarchive">repo</a></p>
        </footer>
    </div>
</body>
</html>
